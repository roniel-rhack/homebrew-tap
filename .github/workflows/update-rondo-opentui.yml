name: Update rondo-opentui formula

on:
  repository_dispatch:
    types: [update-rondo-opentui]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update (e.g., 0.1.0)"
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="$INPUT_VERSION"
          fi
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid version: $VERSION" && exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsSL "https://github.com/roniel-rhack/rondo-opentui/releases/download/v${VERSION}/checksums-sha256.txt" -o checksums.txt
          cat checksums.txt

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA_DARWIN_ARM64=$(grep "rondo-opentui-darwin-arm64.tar.gz" checksums.txt | awk '{print $1}')
          SHA_DARWIN_AMD64=$(grep "rondo-opentui-darwin-amd64.tar.gz" checksums.txt | awk '{print $1}')
          SHA_LINUX_ARM64=$(grep "rondo-opentui-linux-arm64.tar.gz" checksums.txt | awk '{print $1}')
          SHA_LINUX_AMD64=$(grep "rondo-opentui-linux-amd64.tar.gz" checksums.txt | awk '{print $1}')

          echo "Updating to version $VERSION"

          cat > Formula/rondo-opentui.rb << FORMULA
          class RondoOpentui < Formula
            desc "TUI task manager and journal built with OpenTUI and React"
            homepage "https://github.com/roniel-rhack/rondo-opentui"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/roniel-rhack/rondo-opentui/releases/download/v#{version}/rondo-opentui-darwin-arm64.tar.gz"
                sha256 "$SHA_DARWIN_ARM64"
              end
              on_intel do
                url "https://github.com/roniel-rhack/rondo-opentui/releases/download/v#{version}/rondo-opentui-darwin-amd64.tar.gz"
                sha256 "$SHA_DARWIN_AMD64"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/roniel-rhack/rondo-opentui/releases/download/v#{version}/rondo-opentui-linux-arm64.tar.gz"
                sha256 "$SHA_LINUX_ARM64"
              end
              on_intel do
                url "https://github.com/roniel-rhack/rondo-opentui/releases/download/v#{version}/rondo-opentui-linux-amd64.tar.gz"
                sha256 "$SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "rondo-opentui"
            end

            test do
              assert_predicate bin/"rondo-opentui", :executable?
            end
          end
          FORMULA

          sed -i 's/^          //' Formula/rondo-opentui.rb
          cat Formula/rondo-opentui.rb

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f checksums.txt
          git add Formula/rondo-opentui.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update rondo-opentui to v${VERSION}"
          git push
